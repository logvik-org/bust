[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bust"
version = "0.14"
description = "Utility for simply creating and modifying VHDL bus slave modules"
readme = "README.md"
authors = [
    {name = "Ola Groettvik", email = "olagrottvik@gmail.com"}
]
license = {text = "MIT"}
keywords = ["vhdl", "bus", "axi", "ipbus", "slave", "generator"]
requires-python = ">=3.9.0"
dependencies = [
    "docopt>=0.6.2",
    "pylatexenc>=2.1",
    "curses-menu>=0.9.0",
    "prettytable>=2.5.0",
    "Jinja2==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest", "pylint", "mypy"]

[project.scripts]
bust = "bust.__main__:main"

[project.urls]
Homepage = "http://github.com/olagrottvik/bust"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bust.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
