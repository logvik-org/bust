[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bust"
version = "1.0.0-dev"
description = "Utility for simply creating and modifying VHDL bus slave modules"
readme = "README.md"
authors = [
    {name = "Ola Groettvik", email = "olagrottvik@gmail.com"}
]
license = {file = "LICENSE"}
keywords = ["vhdl", "bus", "axi", "ipbus", "slave", "generator"]
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.9.0"
dependencies = [
    "docopt>=0.6.2",
    "pylatexenc>=2.1",
    "curses-menu>=0.9.0",
    "prettytable>=2.5.0",
    "Jinja2>=3.1.5,<4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pylint", "mypy", "pydocstyle"]

[project.scripts]
bust = "bust.__main__:main"

[project.urls]
Homepage = "https://github.com/logvik-org/bust"

[tool.coverage.run]
source = ["bust"]
omit = [
    "bust/_version.py",
    "bust/editor.py",         # interactive curses UI, not exercised in CI
    "bust/__main__.py",       # docopt CLI entrypoint
    # Backward-compatibility shims that only re-export from the new locations.
    "bust/bus.py",
    "bust/bus_vhdl_gen.py",
    "bust/config_wrapper.py",
    "bust/documentation.py",
    "bust/enums.py",
    "bust/field.py",
    "bust/generator_factory.py",
    "bust/header.py",
    "bust/module.py",
    "bust/module_vhdl_gen.py",
    "bust/register.py",
    "bust/testbench.py",
    "bust/utils.py",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true

[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D104", "D107"]
match = "(?!test_).*\\.py"
