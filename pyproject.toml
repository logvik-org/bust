[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bust"
dynamic = ["version"]
description = "Generate VHDL register files, UVVM testbenches, headers and documentation from a JSON register map."
readme = "README.md"
authors = [
    {name = "Ola Groettvik", email = "olagrottvik@gmail.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["vhdl", "fpga", "asic", "register-map", "generator", "uvvm", "axi", "ipbus", "avalon", "wishbone", "apb"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "docopt>=0.6.2",
    "pylatexenc>=2.1",
    "curses-menu>=0.9.0",
    "prettytable>=2.5.0",
    "Jinja2>=3.1.5,<4.0",
    "json5>=0.9",
]

[project.optional-dependencies]
# mypy and vsg are pinned because a new release can report new errors on
# unchanged code.
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy==1.18.2",
    "vsg==3.35.0",
]
dev = [
    "bust[test]",
    "build>=1.0",
    "twine>=5.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.4",
    "myst-parser>=3.0",
    "furo>=2024.8",
]

[project.scripts]
bust = "bust.__main__:main"

[project.urls]
Homepage = "https://github.com/logvik-org/bust"
Documentation = "https://bust.readthedocs.io"
Repository = "https://github.com/logvik-org/bust"
Issues = "https://github.com/logvik-org/bust/issues"
Changelog = "https://github.com/logvik-org/bust/blob/master/CHANGELOG.md"

# The repository root also holds hdl/ and sim/, which flat-layout discovery
# would otherwise pick up as packages.
[tool.setuptools.packages.find]
include = ["bust", "bust.*"]

[tool.setuptools.dynamic]
version = {attr = "bust._version.__VERSION__"}

[tool.setuptools.package-data]
bust = ["templates/**/*.j2"]

[tool.coverage.run]
source = ["bust"]
omit = [
    "bust/_version.py",
    "bust/editor.py",         # interactive curses UI, not exercised in CI
    "bust/__main__.py",       # docopt CLI entrypoint
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true

[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D104", "D107"]
match = "(?!test_).*\\.py"
