version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # pdflatex and the LaTeX packages of the documentation, for the example PDF
  # that docs/conf.py builds.
  apt_packages:
    - texlive-latex-base
    - texlive-latex-recommended
    - texlive-latex-extra

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
