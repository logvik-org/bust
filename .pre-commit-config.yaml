repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        exclude: '^bust/templates/'
    -   id: end-of-file-fixer
        exclude: '^bust/templates/'
-   repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
    -   id: remove-tabs
        exclude: Makefile
    -   id: remove-crlf
-   repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
    -   id: black
        exclude: example/
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v1.2.3
    hooks:
    -   id: flake8
        files: ^script/
