# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run type checking with mypy
      run: |
        mypy bust
    - name: Run tests with coverage
      run: |
        pytest --cov=bust --cov-report=term-missing --cov-report=xml --cov-fail-under=60
    - name: Coverage summary
      if: matrix.python-version == '3.11'
      run: |
        {
          echo '### Coverage report'
          echo '```'
          coverage report
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install build twine
    - name: Build sdist + wheel
      run: python -m build
    - name: Check artifacts
      run: twine check dist/*
    - name: Smoke-test the built wheel
      run: |
        python -m venv "$RUNNER_TEMP/wheel-venv"
        "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
        # -I keeps the checkout off sys.path, so this reads the installed package.
        version="$("$RUNNER_TEMP/wheel-venv/bin/python" -I -c 'from bust._version import __VERSION__; print(__VERSION__)')"
        PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH" scripts/smoke-test.sh "$version"
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
