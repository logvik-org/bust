name: VHDL Simulation

on:
  push:
    branches: ["master", "dev"]
    paths:
      # Run whenever simulation infrastructure or VHDL source changes
      - "sim/**"
      - "example/**/*.vhd"
  pull_request:
    branches: ["**"]
    paths:
      - "sim/**"
      - "example/**/*.vhd"
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  simulate:
    name: nvc - example_ipbus testbench
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push/pull from GHCR

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Docker Buildx for layer-caching support
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # 3. Log in to GitHub Container Registry so we can push/pull the cache
      # -----------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 4. Build (or restore from cache) the simulation Docker image.
      #
      # The image compiles UVVM, IPBus firmware, and vip_ipbus from source.
      # We cache Docker layers in GHCR so the expensive compilation step only
      # re-runs when the Dockerfile or compile script changes.
      # -----------------------------------------------------------------------
      - name: Build simulation image
        uses: docker/build-push-action@v5
        with:
          context: sim/
          load: true         # make the image available to `docker run` below
          push: false
          tags: bust-sim:ci
          cache-from: type=registry,ref=ghcr.io/grottviq/bust-sim-cache:buildcache
          cache-to:   type=registry,ref=ghcr.io/grottviq/bust-sim-cache:buildcache,mode=max

      # -----------------------------------------------------------------------
      # 5. Run the IPBus testbench
      # -----------------------------------------------------------------------
      - name: Run example_ipbus simulation
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -e WORK_ROOT=/work \
            bust-sim:ci \
            /work/sim/scripts/run_sim.sh example_ipbus
