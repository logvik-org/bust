name: Example PDF

# docs/examples/prototype.pdf is committed because Read the Docs has no
# pdflatex. Rebuild it from the committed prototype.tex and fail if it differs,
# so the PDF in the documentation cannot fall behind the LaTeX golden.
on:
  push:
    branches: ["master"]
    paths:
      - "example/example_prototype/doc/prototype.tex"
      - "docs/examples/prototype.pdf"
      - "scripts/make-example-pdf.sh"
      - ".github/workflows/example_pdf.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "example/example_prototype/doc/prototype.tex"
      - "docs/examples/prototype.pdf"
      - "scripts/make-example-pdf.sh"
      - ".github/workflows/example_pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    # Pinned: the PDF is byte-for-byte reproducible only with the same TeX Live,
    # and the committed file was built with TeX Live 2023 from Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install pdflatex
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra
    - name: Rebuild the example PDF
      run: scripts/make-example-pdf.sh
    - name: Compare with the committed PDF
      run: |
        if ! git diff --quiet -- docs/examples/prototype.pdf; then
          echo "::error file=docs/examples/prototype.pdf::The committed PDF does not match prototype.tex. Run scripts/make-example-pdf.sh on Ubuntu 24.04 and commit the PDF."
          exit 1
        fi
