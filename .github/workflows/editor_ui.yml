name: Editor UI

on:
  push:
    branches: [ "master" ]
    tags: [ "editor-ui-v*" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

concurrency:
  group: editor-ui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: editor-ui

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # The tests run the editor against bust's bridge over stdio.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.13"
    - run: pip install -e ..
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: editor-ui/package-lock.json
    - run: npm ci
    - run: npm test
      env:
        PYTHON: python
    - run: npm pack --dry-run

  # Pushing a tag editor-ui-vX.Y.Z publishes that version to npm, with npm
  # trusted publishing, so no token is stored here. The package must exist on
  # npm with this workflow set as its trusted publisher.
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/editor-ui-v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
    - name: Check that the tag matches the package version
      run: |
        version="$(node -p 'require("./package.json").version')"
        if [ "editor-ui-v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match version $version in editor-ui/package.json"
          exit 1
        fi
    - run: npm ci
    - run: npm run build
    - run: npm publish --provenance --access public
